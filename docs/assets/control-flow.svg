<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">STM32 제어 흐름과 H-bridge 대응 출력 패턴</title>
  <desc id="desc">인터럽트는 수신 문자와 시간 정보를 전달한다. 메인 루프는 UART 명령과 PC13 버튼을 해석하고 MotorController의 상태를 변경한 뒤 Motor_Update를 통해 GPIO와 TIM5 PWM을 적용한다. TIM4 tick은 버튼 시간 판정과 모터 출력 전환 대기에 사용한다. FORWARD는 PA0 Low·PA1 PWM, REVERSE는 PA0 PWM·PA1 Low, STOP은 두 핀 Low를 적용한다. H-bridge의 두 입력 제어 패턴과 대응하는 코드 구조이며 실제 드라이버 모델·회로와 정지 동작은 미확인이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#172b46}
      .title{font-size:25px;font-weight:700}
      .heading{font-size:21px;font-weight:650}
      .label{font-size:19px}
      .detail{font-size:18px;fill:#475569}
      .path{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="638" height="798" rx="16" fill="#ffffff" stroke="#dce3ed"/>
  <text x="24" y="40" class="title">입력 → 상태 → 출력</text>
  <rect x="24" y="65" width="284" height="108" rx="10" fill="#f0fdfa" stroke="#99d7ca"/>
  <text x="166" y="99" text-anchor="middle" class="heading">USART2 수신 ISR</text>
  <text x="166" y="134" text-anchor="middle" class="label">수신 문자 · 완료 플래그</text>
  <rect x="332" y="65" width="284" height="108" rx="10" fill="#f0fdfa" stroke="#99d7ca"/>
  <text x="474" y="99" text-anchor="middle" class="heading">TIM2 · TIM4 ISR</text>
  <text x="474" y="134" text-anchor="middle" class="label">타임아웃 · 1 ms tick</text>
  <rect x="24" y="212" width="592" height="328" rx="12" fill="#f3f7ff" stroke="#bfd1eb"/>
  <text x="44" y="244" class="heading">메인 루프</text>
  <path d="M166 173 V265" class="path"/>
  <path d="M474 173 V265" class="path"/>
  <rect x="44" y="268" width="260" height="60" rx="8" fill="#ffffff" stroke="#bfd1eb"/>
  <text x="174" y="305" text-anchor="middle" class="heading">UART 명령 해석</text>
  <rect x="336" y="268" width="260" height="60" rx="8" fill="#ffffff" stroke="#bfd1eb"/>
  <text x="466" y="305" text-anchor="middle" class="heading">PC13 폴링 · 버튼 FSM</text>
  <path d="M174 328 V344 H270 V363" class="path"/>
  <path d="M466 328 V344 H370 V363" class="path"/>
  <rect x="128" y="366" width="384" height="70" rx="8" fill="#e0ebff" stroke="#9bb8e0"/>
  <text x="320" y="395" text-anchor="middle" class="heading">MotorController</text>
  <text x="320" y="422" text-anchor="middle" class="label">state · last_dir · duty</text>
  <path d="M320 436 V472" class="path"/>
  <rect x="44" y="475" width="552" height="44" rx="8" fill="#ffffff" stroke="#bfd1eb"/>
  <text x="320" y="503" text-anchor="middle" class="heading">Motor_Update → GPIO / TIM5 PWM</text>
  <path d="M320 519 V557" class="path"/>
  <rect x="44" y="560" width="552" height="152" rx="8" fill="#f0fdfa" stroke="#99d7ca"/>
  <text x="64" y="590" class="heading">MCU 제어 신호</text>
  <text x="430" y="590" text-anchor="middle" class="label">PA0 / PA1</text>
  <text x="64" y="624" class="label">FORWARD</text>
  <text x="430" y="624" text-anchor="middle" class="label">Low / PWM</text>
  <text x="64" y="657" class="label">REVERSE</text>
  <text x="430" y="657" text-anchor="middle" class="label">PWM / Low</text>
  <text x="64" y="690" class="label">STOP</text>
  <text x="430" y="690" text-anchor="middle" class="label">Low / Low</text>
  <path d="M320 712 V739" class="path"/>
  <rect x="44" y="742" width="552" height="38" rx="8" fill="#f8fafc" stroke="#dce3ed"/>
  <text x="320" y="768" text-anchor="middle" class="detail">외부 드라이버(회로 미확인) → DC 모터</text>
</svg>
